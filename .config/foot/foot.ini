[main]
include=~/.config/foot/themes/noctalia


pad=8x8                             # Adds 8px padding inside the terminal window
dpi-aware=true                      # Automatically scales font with monitor DPI

font=monospace, Symbols Nerd Font
font-bold=monospace:weight=bold, Symbols Nerd Font:style=Regular

[cursor]
style=beam                          # Options: block, beam, underline
blink=yes

[scrollback]
lines=10000
