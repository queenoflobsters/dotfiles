[wallpaper]
enabled = true
fill_mode = "crop"
directory = "/home/gaybe/extras/wallpapers/forest"
transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_on_startup = true

[wallpaper.automation]
enabled = true
interval_seconds = 1200
order = "random"
recursive = true

[wallpaper.default]
path = "/home/gaybe/extras/wallpapers/forest/16.jpg"

[wallpaper.monitor.DP-2]
enabled = false
fill_color = "#000000"


[theme]
mode = "dark"
source = "builtin"
builtin = "Kanagawa"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [
  "alacritty",
  "btop",
  "cava",
  "gtk3",
  "gtk4",
  "ghostty",
  "helix",
  "hyprland",
  "kcolorscheme",
  "kitty",
  "qt"
]
community_ids = [
  "discord",
  "libreoffice",
  "yazi"
]

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-001",
    "desktop-widget-002",
    "desktop-widget-003",
    "desktop-widget-004",
    "desktop-widget-006",
    "desktop-widget-007",
    "desktop-widget-008"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-001]
    box_height = 544.0
    box_width = 2544.0
    cx = 1280.0
    cy = 1160.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-001.settings]
        background = false
        bands = 128
        centered = false
        reversed = false
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-002]
    box_height = 752.0
    box_width = 800.0
    cx = 1280.0
    cy = 616.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-002.settings]
        background = false
        bar_width = 0.4
        bloom_intensity = 0.35
        fade_when_idle = true
        inner_diameter = 0.6
        rotation_speed = 0.2
        visualization_mode = "all"
        wave_thickness = 0.6

    [desktop_widgets.widget.desktop-widget-003]
